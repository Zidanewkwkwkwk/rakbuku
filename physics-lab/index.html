      border-radius: 9999px;

    /* Range Slider Styling */
    input[type="range"].lab-slider {
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      background: #13224a;
      border-radius: 999px;
      outline: none;

    input[type="range"].lab-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #38bdf8;
      border: 2px solid #040814;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);

    input[type="range"].lab-slider::-webkit-slider-thumb:hover {

    }

    #sim-canvas-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: none;

  <script>
    /* =========================================================================
       1. DATA MODUL FISIKA KELAS X (FASE E - KURIKULUM MERDEKA)
       ========================================================================= */
    const MODULES = [
      {
        id: 'pengukuran',
        code: 'MOD-01',
        title: 'Pengukuran & Besaran Fisika',
        shortDesc: 'Besaran pokok/turunan, satuan SI, dimensi, angka penting, jangka sorong & mikrometer sekrup.',
        icon: '📏',
        intro: 'Dalam sains, pengamatan kualitatif tidak cukup—kita memerlukan pengukuran kuantitatif yang presisi menggunakan satuan standar internasional (SI) dan alat ukur yang sesuai ketelitiannya.',
        theory: 'Besaran pokok adalah besaran yang satuannya telah ditetapkan terlebih dahulu (panjang [m], massa [kg], waktu [s], suhu [K], kuat arus [A], intensitas cahaya [cd], jumlah zat [mol]). Besaran turunan disusun dari kombinasi besaran pokok. Ketelitian alat ukur menentukan ketidakpastian mutlak (Δx = 0,5 × NST). Jangka sorong memiliki ketelitian 0,1 mm (atau 0,01 cm), sedangkan mikrometer sekrup memiliki ketelitian 0,01 mm.',
        formulas: [
          { eq: 'x = (SU + SN × ketelitian) ± Δx', desc: 'Hasil pengukuran tunggal dengan ketidakpastian mutlak Δx = 0,5 × NST (satuan: mm atau cm)' },
          { eq: 'KSR (%) = (Δx / x) × 100%', desc: 'Ketidakpastian relatif persentase menunjukkan tingkat presisi pengukuran (%)' }
        ],
        howItWorks: 'Skala utama membaca nilai penuh tepat sebelum tanda nol skala nonius. Skala nonius (vernier) membaca garis yang paling sejajar dengan garis skala utama, lalu dikalikan ketelitian alat (0,1 mm pada jangka sorong; 0,01 mm pada mikrometer sekrup).',
        dailyExample: 'Montir bengkel mengukur diameter piston mesin menggunakan mikrometer sekrup agar celah ring piston presisi hingga seperseratus milimeter, dan mengukur diameter dalam pipa menggunakan rahang jangka sorong.',
        sampleProblem: {
          question: 'Sebuah jangka sorong (ketelitian 0,1 mm) menunjukkan skala utama 24 mm dan skala nonius garis ke-6 sejajar. Berapakah hasil pengukurannya?',
          steps: [
            '1. Baca Skala Utama (SU) = 24 mm.',
            '2. Baca Skala Nonius (SN) = 6 × 0,1 mm = 0,6 mm.',
            '3. Hitung hasil pengukuran: x = 24 mm + 0,6 mm = 24,6 mm.',
            '4. Ketidakpastian Δx = 0,5 × 0,1 mm = 0,05 mm → (24,60 ± 0,05) mm.'
          ]
        },
        summary: 'Pilih alat ukur sesuai ukuran dan tingkat ketelitian yang dibutuhkan. Perhatikan aturan angka penting (AP) pada hasil perhitungan agar akurasi data ilmiah tetap terjaga.',
        sliders: [
          { key: 'caliperPos', label: 'Posisi Rahang Jangka Sorong', min: 5, max: 45, step: 0.1, unit: 'mm', defaultVal: 18.4 },
          { key: 'micrometerPos', label: 'Bukaan Mikrometer Sekrup', min: 1, max: 20, step: 0.01, unit: 'mm', defaultVal: 7.35 }
        ],
        calcPreset: {
          name: 'Hasil Pengukuran (SU + SN × Ketelitian)',
          vars: [
            { id: 'su', label: 'Skala Utama (mm)', val: 24 },
            { id: 'sn', label: 'Garis Nonius Sejajar', val: 6 },
            { id: 'nst', label: 'Ketelitian Alat (mm)', val: 0.1 }
          ],
          compute: (v) => {
            const res = v.su + v.sn * v.nst;
            return {
              result: `${res.toFixed(2)} mm`,
              explanation: `x = ${v.su} + (${v.sn} × ${v.nst}) = ${res.toFixed(2)} mm`
            };
          }
        }
      },
      {
        id: 'vektor',
        code: 'MOD-02',
        title: 'Vektor',
        shortDesc: 'Besaran vektor vs skalar, komponen vektor, penjumlahan, pengurangan & resultan vektor.',
        icon: '↗️',
        intro: 'Beberapa besaran fisika tidak cukup dinyatakan dengan nilai saja—perpindahan sejauh 10 km ke timur berbeda total dampaknya dibanding 10 km ke barat.',
        theory: 'Besaran skalar hanya memiliki nilai (besar) dan satuan (contoh: massa, waktu, suhu, kelajuan). Besaran vektor memiliki besar dan arah (contoh: gaya, kecepatan, percepatan, perpindahan). Vektor dapat diuraikan ke sumbu X dan Y menggunakan trigonometri: Fx = F cos θ dan Fy = F sin θ. Resultan dua vektor gaya dirumuskan dengan aturan kosinus.',
        formulas: [
          { eq: 'Rx = A cos θA + B cos θB', desc: 'Komponen resultan pada sumbu horizontal X (satuan: N atau m)' },
          { eq: 'Ry = A sin θA + B sin θB', desc: 'Komponen resultan pada sumbu vertikal Y (satuan: N atau m)' },
          { eq: 'R = √(Rx² + Ry²)', desc: 'Besar vektor resultan total (satuan: N atau m)' }
        ],
        howItWorks: 'Setiap panah vektor merepresentasikan besar (panjang panah) dan arah (sudut θ terhadap sumbu +X). Dengan menjumlahkan proyeksi horizontal (cos) dan vertikal (sin), kita memperoleh vektor resultan R yang efeknya setara dengan gabungan semua vektor.',
        dailyExample: 'Dua kapal tunda menarik tongkang dengan sudut dan gaya berbeda; arah gerak tongkang ditentukan oleh resultan kedua gaya tarik tersebut.',
        sampleProblem: {
          question: 'Vektor gaya F1 = 10 N ke arah 0° (sumbu +X) dan F2 = 10 N ke arah 90° (sumbu +Y). Berapakah besar resultannya?',
          steps: [
            '1. Rx = 10 cos(0°) + 10 cos(90°) = 10(1) + 10(0) = 10 N.',
            '2. Ry = 10 sin(0°) + 10 sin(90°) = 10(0) + 10(1) = 10 N.',
            '3. R = √(10² + 10²) = √200 ≈ 14,14 N dengan sudut 45°.'
          ]
        },
        summary: 'Vektor dijumlahkan secara geometris/komponen, bukan aljabar biasa. Sudut 90° antara dua vektor sama besar menghasilkan resultan √2 kali besar salah satu vektor.',
        sliders: [
          { key: 'vecAMag', label: 'Besar Vektor A (Biru)', min: 1, max: 12, step: 0.5, unit: 'N', defaultVal: 6 },
          { key: 'vecAAngle', label: 'Sudut Vektor A', min: 0, max: 360, step: 5, unit: '°', defaultVal: 25 },
          { key: 'vecBMag', label: 'Besar Vektor B (Kuning)', min: 1, max: 12, step: 0.5, unit: 'N', defaultVal: 5 },
          { key: 'vecBAngle', label: 'Sudut Vektor B', min: 0, max: 360, step: 5, unit: '°', defaultVal: 110 }
        ],
        calcPreset: {
          name: 'Resultan 2 Vektor Tegak Lurus (R = √(A² + B²))',
          vars: [
            { id: 'a', label: 'Komponen Rx (N)', val: 8 },
            { id: 'b', label: 'Komponen Ry (N)', val: 6 }
          ],
          compute: (v) => {
            const r = Math.sqrt(v.a * v.a + v.b * v.b);
            return {
              result: `${r.toFixed(2)} N`,
              explanation: `R = √(${v.a}² + ${v.b}²) = √(${v.a*v.a} + ${v.b*v.b}) = ${r.toFixed(2)} N`
            };
          }
        }
      },
      {
        id: 'gerak-lurus',
        code: 'MOD-03',
        title: 'Gerak Lurus (GLB & GLBB)',
        shortDesc: 'Posisi, perpindahan, kecepatan, percepatan konstan, serta grafik x-t dan v-t real-time.',
        icon: '🚗',
        intro: 'Ketika mobil melaju di jalan tol lurus, kecepatannya bisa tetap konstan (GLB) atau bertambah/berkurang secara teratur saat digas atau direm (GLBB).',
        theory: 'Jarak adalah panjang lintasan total (skalar), sedangkan perpindahan adalah perubahan posisi dari titik awal ke titik akhir (vektor). Pada Gerak Lurus Beraturan (GLB), percepatan a = 0 sehingga kecepatan v tetap. Pada Gerak Lurus Berubah Beraturan (GLBB), percepatan a konstan sehingga kecepatan berubah linear terhadap waktu dan posisi berubah kuadratik terhadap waktu.',
        formulas: [
          { eq: 'v(t) = v₀ + a·t', desc: 'Kecepatan sesaat pada waktu t (v₀: kecepatan awal [m/s], a: percepatan [m/s²], t: waktu [s])' },
          { eq: 'x(t) = x₀ + v₀·t + ½·a·t²', desc: 'Posisi benda pada waktu t (satuan: meter [m])' }
        ],
        howItWorks: 'Jika percepatan a = 0, grafik v-t berupa garis mendatar dan grafik x-t berupa garis lurus miring. Jika a > 0, mobil mengalami percepatan sehingga grafik v-t menanjak dan grafik x-t melengkung ke atas.',
        dailyExample: 'Kendaraan yang melaju stabil 60 km/jam di jalan lurus menerapkan prinsip GLB, sedangkan mobil yang mulai bergerak dari lampu merah dengan injakan gas tetap menerapkan GLBB dipercepat.',
        sampleProblem: {
          question: 'Mobil bergerak lurus dengan v₀ = 4 m/s dan percepatan konstan a = 2 m/s². Berapakah kecepatannya setelah t = 5 s?',
          steps: [
            '1. Diketahui: v₀ = 4 m/s, a = 2 m/s², t = 5 s.',
            '2. Gunakan rumus v(t) = v₀ + a·t.',
            '3. v(5) = 4 + (2 × 5) = 4 + 10 = 14 m/s.'
          ]
        },
        summary: 'Percepatan adalah laju perubahan kecepatan per satuan waktu. Luas daerah di bawah grafik v-t menyatakan besar perpindahan benda.',
        sliders: [
          { key: 'v0', label: 'Kecepatan Awal (v₀)', min: 0, max: 20, step: 0.5, unit: 'm/s', defaultVal: 5 },
          { key: 'accel', label: 'Percepatan (a)', min: -4, max: 8, step: 0.5, unit: 'm/s²', defaultVal: 2 }
        ],
        calcPreset: {
          name: 'GLBB: Kecepatan & Perpindahan (v = v₀ + at)',
          vars: [
            { id: 'v0', label: 'Kecepatan Awal v₀ (m/s)', val: 5 },
            { id: 'a', label: 'Percepatan a (m/s²)', val: 2 },

    const STORAGE_KEY = 'physics_lab_3d_progress_v1';

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          return JSON.parse(raw);
        }
      } catch (e) {
        console.warn('Gagal membaca localStorage:', e);
      }
      return {
        completedModules: [],
        quizScores: {}, // moduleId -> { score, total, date }
        challengesSolved: [],
        totalSimTimeSec: 0
      };
    }

    function saveProgress() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState.progress));
      } catch (e) {
        console.warn('Gagal menyimpan ke localStorage:', e);
      }

      route: 'home', // 'home' | 'materi' | 'simulation' | 'experiment' | 'quiz' | 'progress'

    // Inisialisasi nilai parameter default dari semua modul
    function initDefaultParams() {
      MODULES.forEach((mod) => {
        mod.sliders.forEach((s) => {
          if (appState.params[s.key] === undefined) {
            appState.params[s.key] = s.defaultVal;
          }
        });
      });
    }
    initDefaultParams();

    function showToast(msg) {
      const box = document.getElementById('toast-box');
      const text = document.getElementById('toast-message');
      text.textContent = msg;
      box.classList.remove('hidden');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        box.classList.add('hidden');
      }, 3000);
    }

    /* =========================================================================
       4. NAVIGASI UTAMA & RENDER HALAMAN
       ========================================================================= */
    function navigateTo(route, moduleId = null) {
      const keepScroll = appState.route === route && (!moduleId || moduleId === appState.activeModuleId);
      const savedY = window.scrollY;
      if (moduleId) {
        appState.activeModuleId = moduleId;
        appState.challengeTargetDist = pickChallengeTarget(moduleId);
        resetSimState();
      }
      appState.route = route;

      // Update active nav styling
      document.querySelectorAll('.nav-btn').forEach((btn) => {
        const isActive = btn.dataset.nav === route;
        btn.classList.toggle('bg-electric-500/20', isActive);
        btn.classList.toggle('text-electric-400', isActive);
        btn.classList.toggle('border', isActive);
        btn.classList.toggle('border-electric-400/40', isActive);
      });

      const root = document.getElementById('app-root');
      destroyThreeScene();

      if (route === 'home') {
        root.innerHTML = renderHomeView();
        initHeroMiniPreview();
      } else if (route === 'materi') {
        root.innerHTML = renderMateriListView();
      } else if (route === 'simulation') {
        root.innerHTML = renderSplitLabView({ mode: 'simulation' });
        mountThreeLab('simulation');
      } else if (route === 'experiment') {
        root.innerHTML = renderSplitLabView({ mode: 'experiment' });
        mountThreeLab('experiment');
      } else if (route === 'quiz') {
        root.innerHTML = renderQuizView();
      } else if (route === 'progress') {
        root.innerHTML = renderProgressView();
      }

      window.scrollTo(keepScroll ? { top: savedY } : { top: 0, behavior: 'smooth' });
    }

    function toggleMobileMenu(forceState = null) {
      const menu = document.getElementById('mobile-menu');
      if (forceState === false) {
        menu.classList.add('hidden');
      } else if (forceState === true) {
        menu.classList.remove('hidden');
      } else {
        menu.classList.toggle('hidden');
      }
    }

        const r = ((P.launchAngle ?? 45) * Math.PI) / 180;
        return ((P.launchSpeed ?? 18) ** 2 * Math.sin(2 * r)) / (P.gravity ?? 9.8);
      } },
      'vektor': { min: 6, max: 14, step: 1, unit: 'N', tol: 0.3, task: 'Atur vektor A dan B agar besar resultan R =', value: (P) => {
        const ra = ((P.vecAAngle ?? 25) * Math.PI) / 180, rb = ((P.vecBAngle ?? 110) * Math.PI) / 180;
        return Math.hypot((P.vecAMag ?? 6) * Math.cos(ra) + (P.vecBMag ?? 5) * Math.cos(rb), (P.vecAMag ?? 6) * Math.sin(ra) + (P.vecBMag ?? 5) * Math.sin(rb));
      } },
      'hukum-newton': { min: 1, max: 4, step: 0.5, unit: 'm/s²', tol: 0.15, task: 'Buat balok bergerak dengan percepatan a =', value: (P) => {
        const m = P.massBlock ?? 5, F = P.pushForce ?? 35, mu = P.frictionCoeff ?? 0.25;
        return F > mu * 1.2 * m * 9.8 ? (F - mu * m * 9.8) / m : 0;
      } },
      'getaran-gelombang': { min: 2, max: 6, step: 0.5, unit: 'm/s', tol: 0.15, task: 'Atur λ dan f agar cepat rambat v =', value: (P) => (P.wavelength ?? 3) * (P.frequency ?? 1.1) }
    };

    function pickChallengeTarget(moduleId) {
      const c = CHALLENGES[moduleId];
      if (!c) return appState.challengeTargetDist;
      return Math.round((c.min + Math.random() * (c.max - c.min)) / c.step) * c.step;

    function evaluateChallenge() {
      const id = appState.activeModuleId;
      const c = CHALLENGES[id];
      if (!c) return;
      const val = c.value(appState.params);
      const target = appState.challengeTargetDist;
      const diff = Math.abs(val - target);
      appState.simTime = 0;
      appState.isPlaying = true;
      const btn = document.getElementById('btn-play-pause');
      if (btn) btn.textContent = 'Pause';
      if (diff <= c.tol) {
        appState.challengeStatus = `BERHASIL! Hasilmu ${val.toFixed(2)} ${c.unit} sesuai target ${target} ${c.unit}.`;
        const key = id + ':' + target;
        if (!appState.progress.challengesSolved.includes(key)) {
          appState.progress.challengesSolved.push(key);
          saveProgress();
        }
        showToast('Target tantangan berhasil dicapai!');
      } else {
        appState.challengeStatus = `Hasilmu ${val.toFixed(2)} ${c.unit} (selisih ${diff.toFixed(2)} dari target ${target}). Coba atur lagi.`;
      }
      const el = document.getElementById('challenge-feedback');
      if (el) el.textContent = appState.challengeStatus;
    }

    const threeState = {
      scene: null,

      renderer: null,
      animId: null,
      container: null,
      entities: {},
      pointer: {

        button: 0,

    function destroyThreeScene() {
      if (threeState.animId) {
        cancelAnimationFrame(threeState.animId);
        threeState.animId = null;
      }
      window.removeEventListener('resize', handleResize);
      if (threeState.scene) {
        threeState.scene.traverse((o) => {
          if (o.geometry) o.geometry.dispose();
          if (o.material) [].concat(o.material).forEach((mt) => mt.dispose());
        });
      }
      if (threeState.renderer) {
        threeState.renderer.dispose();
        threeState.renderer.forceContextLoss();
        threeState.renderer = null;
      }
      threeState.scene = null;
      threeState.camera = null;
      threeState.entities = {};
    }

    function initHeroMiniPreview() {
      const container = document.getElementById('hero-3d-preview');
      if (!container || typeof THREE === 'undefined') return;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#040814');

      const w = container.clientWidth || 400;
      const h = container.clientHeight || 300;
      const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 200);
      camera.position.set(12, 9, 18);
      camera.lookAt(5, 3, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.innerHTML = '';
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0x94a3b8, 0.9));
      const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.3);
      dirLight.position.set(10, 20, 12);
      scene.add(dirLight);

      const grid = new THREE.GridHelper(30, 30, 0x0ea5e9, 0x13224a);
      scene.add(grid);

      // Trajectory arc preview
      const pts = [];
      for (let i = 0; i <= 40; i++) {
        const t = (i / 40) * 2.6;
        const x = 18 * Math.cos(Math.PI / 4) * t;
        const y = Math.max(0.3, 18 * Math.sin(Math.PI / 4) * t - 0.5 * 9.8 * t * t);
        pts.push(new THREE.Vector3(x - 6, y, 0));
      }
      const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
      const lineMat = new THREE.LineBasicMaterial({ color: 0x38bdf8 });
      scene.add(new THREE.Line(lineGeo, lineMat));

      const ball = new THREE.Mesh(
        new THREE.SphereGeometry(0.65, 24, 24),
        new THREE.MeshStandardMaterial({ color: 0xf97316, emissive: 0x7c2d12, roughness: 0.3 })
      );
      scene.add(ball);

      let tAnim = 0;
      function animatePreview() {
        threeState.animId = requestAnimationFrame(animatePreview);
        tAnim = (tAnim + 0.025) % 2.6;
        const x = 18 * Math.cos(Math.PI / 4) * tAnim - 6;
        const y = Math.max(0.65, 18 * Math.sin(Math.PI / 4) * tAnim - 0.5 * 9.8 * tAnim * tAnim);
        ball.position.set(x, y, 0);
        camera.position.x = Math.cos(Date.now() * 0.0004) * 18;
        camera.position.z = Math.sin(Date.now() * 0.0004) * 18;
        camera.lookAt(0, 3, 0);
        renderer.render(scene, camera);
      }
      animatePreview();
    }

    function mountThreeLab() {
      const container = document.getElementById('sim-canvas-container');
      if (!container || typeof THREE === 'undefined') return;

      threeState.container = container;
      const width = container.clientWidth || 640;
      const height = container.clientHeight || 400;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#040814');
      scene.fog = new THREE.FogExp2('#040814', 0.018);

      const camera = new THREE.PerspectiveCamera(48, width / height, 0.1, 250);
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.innerHTML = '';
      container.appendChild(renderer.domElement);

      // Lighting
      scene.add(new THREE.AmbientLight(0xcbd5e1, 0.85));
      const keyLight = new THREE.DirectionalLight(0x38bdf8, 1.35);
      keyLight.position.set(14, 24, 16);
      scene.add(keyLight);
      const rimLight = new THREE.DirectionalLight(0xf59e0b, 0.55);
      rimLight.position.set(-14, 10, -12);
      scene.add(rimLight);

      // Reference Grid
      const grid = new THREE.GridHelper(44, 44, 0x0ea5e9, 0x13224a);
      grid.position.y = 0;
      scene.add(grid);

      threeState.scene = scene;
      threeState.camera = camera;
      threeState.renderer = renderer;

      buildModuleScene(appState.activeModuleId);
      updateCameraFromSpherical();
      attachCameraControls(renderer.domElement);

      window.addEventListener('resize', handleResize);

      let lastFrame = performance.now();
      function loop(now) {
        threeState.animId = requestAnimationFrame(loop);
        const dt = Math.min(0.05, (now - lastFrame) / 1000);
        lastFrame = now;

        if (appState.isPlaying) {
          advancePhysicsStep(dt);
        } else {
          updateVisualsOnly();
        }

        renderTelemetryGraph();
        renderer.render(scene, camera);
      }
      threeState.animId = requestAnimationFrame(loop);
    }

    function handleResize() {
      if (!threeState.container || !threeState.camera || !threeState.renderer) return;
      const w = threeState.container.clientWidth;
      const h = threeState.container.clientHeight;
      if (w > 0 && h > 0) {
        threeState.camera.aspect = w / h;
        threeState.camera.updateProjectionMatrix();
        threeState.renderer.setSize(w, h);
      }
    }

    function updateCameraFromSpherical() {
      const p = threeState.pointer;
      p.phi = Math.max(0.18, Math.min(Math.PI / 2 - 0.04, p.phi));
      p.radius = Math.max(5, Math.min(60, p.radius));

      const x = p.target.x + p.radius * Math.sin(p.phi) * Math.sin(p.theta);
      const y = p.target.y + p.radius * Math.cos(p.phi);
      const z = p.target.z + p.radius * Math.sin(p.phi) * Math.cos(p.theta);

      if (threeState.camera) {
        threeState.camera.position.set(x, y, z);
        threeState.camera.lookAt(p.target);
      }
    }

    function resetCameraView() {
      threeState.pointer.theta = 0.55;
      threeState.pointer.phi = 1.05;
      threeState.pointer.radius = 22;
      threeState.pointer.target.set(0, 2.5, 0);
      updateCameraFromSpherical();
      showToast('Posisi kamera direset.');
    }

    function cycleCameraPreset() {
      const presets = [
        { theta: 0.55, phi: 1.05, radius: 22, target: [0, 2.5, 0], name: 'Perspektif 3D' },
        { theta: 0.0, phi: 1.45, radius: 24, target: [0, 3.0, 0], name: 'Tampak Depan' },
        { theta: 0.0, phi: 0.25, radius: 22, target: [0, 0.5, 0], name: 'Tampak Atas' }
      ];
      appState.cameraPresetIndex = (appState.cameraPresetIndex + 1) % presets.length;
      const pr = presets[appState.cameraPresetIndex];
      threeState.pointer.theta = pr.theta;
      threeState.pointer.phi = pr.phi;
      threeState.pointer.radius = pr.radius;
      threeState.pointer.target.set(...pr.target);
      updateCameraFromSpherical();
      showToast(`Kamera: ${pr.name}`);
    }

    function attachCameraControls(dom) {
      const p = threeState.pointer;

      dom.addEventListener('contextmenu', (e) => e.preventDefault());
      dom.addEventListener('mouseleave', () => { p.isDown = false; });
      dom.addEventListener('touchend', (e) => {
        p.lastPinchDist = 0;
        p.touches = e.touches.length;
        if (e.touches.length === 1) { p.lastX = e.touches[0].clientX; p.lastY = e.touches[0].clientY; }
      });

      dom.addEventListener('mousedown', (e) => {
        p.isDown = true;
        p.button = e.button;
        p.lastX = e.clientX;
        p.lastY = e.clientY;
      });

      dom.addEventListener('mouseup', () => {
        p.isDown = false;
      });

      dom.addEventListener('mousemove', (e) => {
        if (!p.isDown) return;
        const dx = e.clientX - p.lastX;
        const dy = e.clientY - p.lastY;
        p.lastX = e.clientX;
        p.lastY = e.clientY;

        if (p.button === 2 || e.shiftKey) {
          // Pan kamera
          const panSpeed = 0.025;
          p.target.x -= dx * panSpeed * Math.cos(p.theta);
          p.target.z += dx * panSpeed * Math.sin(p.theta);
          p.target.y += dy * panSpeed;
        } else {
          // Orbit 360 derajat
          p.theta -= dx * 0.008;
          p.phi -= dy * 0.008;
        }
        updateCameraFromSpherical();
      });

      dom.addEventListener('wheel', (e) => {
        e.preventDefault();
        p.radius += e.deltaY * 0.015;
        updateCameraFromSpherical();
      }, { passive: false });

      // Touch controls (1 jari orbit, 2 jari pinch-zoom & pan)
      dom.addEventListener('touchstart', (e) => {
        p.touches = e.touches.length;
        if (e.touches.length === 1) {
          p.lastX = e.touches[0].clientX;
          p.lastY = e.touches[0].clientY;
        } else if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          p.lastPinchDist = Math.hypot(dx, dy);
          p.lastX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
          p.lastY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        }
      }, { passive: false });

      dom.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (e.touches.length === 1) {
          const t = e.touches[0];
          const dx = t.clientX - p.lastX;
          const dy = t.clientY - p.lastY;
          p.lastX = t.clientX;
          p.lastY = t.clientY;
          p.theta -= dx * 0.009;
          p.phi -= dy * 0.009;
          updateCameraFromSpherical();
        } else if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.hypot(dx, dy);
          if (p.lastPinchDist > 0) {
            p.radius += (p.lastPinchDist - dist) * 0.04;
          }
          p.lastPinchDist = dist;

          const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
          const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          p.target.x -= (midX - p.lastX) * 0.02;
          p.target.y += (midY - p.lastY) * 0.02;
          p.lastX = midX;
          p.lastY = midY;
          updateCameraFromSpherical();
        }
      }, { passive: false });
    }

    /* =========================================================================
       9. PEMBANGUNAN OBJEK 3D & LOGIKA FISIKA PER MODUL
       ========================================================================= */

        body.position.y = 1.0;
        const cabin = new THREE.Mesh(

        [[-1.05, 0.45, 0.9], [1.05, 0.45, 0.9], [-1.05, 0.45, -0.9], [1.05, 0.45, -0.9]].forEach(([wx, wy, wz]) => {

        const ball = new THREE.Mesh(

          new THREE.SphereGeometry(0.95, 24, 24),
          new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.3 })
        );
        ball2.position.set(5, 1.2, 0);

        scene.add(ball1, ball2);
        threeState.entities = { ball1, ball2 };
      } else if (moduleId === 'getaran-gelombang') {
        // Pegas osilasi kiri + Gelombang tali/permukaan kanan
        const anchor = new THREE.Mesh(
          new THREE.BoxGeometry(0.5, 4, 0.5),
          new THREE.MeshStandardMaterial({ color: 0x64748b })
        );
        anchor.position.set(-10, 2.5, 0);
        scene.add(anchor);

        const massBob = new THREE.Mesh(

        scene.add(massBob);

        const springLine = new THREE.Line(

        );
        scene.add(springLine);

        // Gelombang transversal (baris titik/bola)
        const waveDots = [];
        const dotGeo = new THREE.SphereGeometry(0.24, 14, 14);
        const dotMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0369a1 });
        for (let i = 0; i < 36; i++) {
          const dot = new THREE.Mesh(dotGeo, dotMat);
          dot.position.set(-2 + i * 0.45, 2.5, 0);

    function resetThreeEntities() {
      if (!threeState.scene) return;
      while (threeState.scene.children.length > 0) {
        const ch = threeState.scene.children[0];
        ch.traverse((o) => {
          if (o.geometry) o.geometry.dispose();
          if (o.material) [].concat(o.material).forEach((mt) => mt.dispose());
        });
        threeState.scene.remove(ch);
      }
      const rim = new THREE.DirectionalLight(0xf59e0b, 0.55);
      rim.position.set(-14, 10, -12);
      threeState.scene.add(rim);
      threeState.scene.add(new THREE.AmbientLight(0xcbd5e1, 0.85));
      const keyLight = new THREE.DirectionalLight(0x38bdf8, 1.35);
      keyLight.position.set(14, 24, 16);
      threeState.scene.add(keyLight);
      threeState.scene.add(new THREE.GridHelper(44, 44, 0x0ea5e9, 0x13224a));
      buildModuleScene(appState.activeModuleId);
    }

    function updateParabolaTrajectoryLine() {
      const ent = threeState.entities;
      if (!ent || !ent.trajLine) return;
      const v0 = appState.params.launchSpeed || 18;
      const deg = appState.params.launchAngle || 45;
      const g = appState.params.gravity || 9.8;
      const rad = (deg * Math.PI) / 180;
      const flightTime = (2 * v0 * Math.sin(rad)) / Math.max(0.5, g);

      const pts = [];
      for (let i = 0; i <= 50; i++) {
        const t = (i / 50) * flightTime;
        const x = -10 + v0 * Math.cos(rad) * t * 0.8;
        const y = Math.max(0.6, 0.6 + (v0 * Math.sin(rad) * t - 0.5 * g * t * t) * 0.8);
        pts.push(new THREE.Vector3(x, y, 0));
      }
      ent.trajLine.geometry.dispose();
      ent.trajLine.geometry = new THREE.BufferGeometry().setFromPoints(pts);
    }

    function advancePhysicsStep(dt) {
      appState.simTime += dt;
      appState.progress.totalSimTimeSec += dt;
      updateVisualsOnly();
    }

    function updateVisualsOnly() {
      const modId = appState.activeModuleId;
      const t = appState.simTime;
      const ent = threeState.entities;
      const metricsEl = document.getElementById('live-physics-metrics');
      const timeEl = document.getElementById('live-time-readout');
      if (timeEl) timeEl.textContent = `t = ${t.toFixed(2)} s`;

      let yMetric1 = 0;
      let yMetric2 = 0;

      if (modId === 'pengukuran') {
        const calPos = appState.params.caliperPos ?? 18.4;
        const micPos = appState.params.micrometerPos ?? 7.35;
        if (ent.jawSliding) {
          ent.jawSliding.position.x = -5.8 + (calPos / 50) * 9.5;
        }
        if (ent.spindle) {
          ent.spindle.position.x = 0.8 + (micPos / 20) * 3.2;
        }
        const su = Math.floor(calPos);
        const sn = Math.round((calPos - su) * 10);
        yMetric1 = calPos;
        yMetric2 = micPos;
        if (metricsEl) {
          metricsEl.innerHTML = `
            <div>Jangka Sorong: <strong>${calPos.toFixed(1)} mm</strong> (SU: ${su} mm, Nonius: ${sn})</div>
            <div>Mikrometer: <strong>${micPos.toFixed(2)} mm</strong> (± 0,01 mm)</div>
          `;
        }
      } else if (modId === 'vektor') {
        const aMag = appState.params.vecAMag ?? 6;
        const aRad = ((appState.params.vecAAngle ?? 25) * Math.PI) / 180;
        const bMag = appState.params.vecBMag ?? 5;
        const bRad = ((appState.params.vecBAngle ?? 110) * Math.PI) / 180;

        const rx = aMag * Math.cos(aRad) + bMag * Math.cos(bRad);
        const ry = aMag * Math.sin(aRad) + bMag * Math.sin(bRad);
        const rMag = Math.hypot(rx, ry);
        const rAngleDeg = ((Math.atan2(ry, rx) * 180) / Math.PI + 360) % 360;

        if (ent.arrowA && ent.arrowB && ent.arrowR) {
          ent.arrowA.setDirection(new THREE.Vector3(Math.cos(aRad), Math.sin(aRad), 0).normalize());
          ent.arrowA.setLength(Math.max(0.5, aMag * 0.85), 0.9, 0.6);

          ent.arrowB.setDirection(new THREE.Vector3(Math.cos(bRad), Math.sin(bRad), 0).normalize());
          ent.arrowB.setLength(Math.max(0.5, bMag * 0.85), 0.9, 0.6);

          if (rMag > 0.05) {
            ent.arrowR.visible = true;
            ent.arrowR.setDirection(new THREE.Vector3(rx / rMag, ry / rMag, 0).normalize());
            ent.arrowR.setLength(Math.max(0.6, rMag * 0.85), 1.0, 0.7);
          } else {
            ent.arrowR.visible = false;
          }
        }
        yMetric1 = rMag;
        yMetric2 = rx;
        if (metricsEl) {
          metricsEl.innerHTML = `
            <div>Resultan R: <strong>${rMag.toFixed(2)} N</strong> pada sudut <strong>${rAngleDeg.toFixed(1)}°</strong></div>
            <div>Komponen: Rx = ${rx.toFixed(2)} N | Ry = ${ry.toFixed(2)} N</div>
          `;
        }
      } else if (modId === 'gerak-lurus') {
        const v0 = appState.params.v0 ?? 5;
        const a = appState.params.accel ?? 2;
        const vNow = v0 + a * t;
        const disp = v0 * t + 0.5 * a * t * t;
        if (ent.carGroup) {
          ent.carGroup.position.x = -10 + Math.max(-4, Math.min(26, disp * 0.6));
        }
        yMetric1 = disp;
        yMetric2 = vNow;
        if (metricsEl) {
          metricsEl.innerHTML = `
            <div>Kecepatan v(t): <strong>${vNow.toFixed(2)} m/s</strong> (v₀=${v0}, a=${a})</div>
            <div>Perpindahan Δx: <strong>${disp.toFixed(2)} m</strong></div>
          `;
        }
      } else if (modId === 'parabola') {
        const v0 = appState.params.launchSpeed ?? 18;
        const deg = appState.params.launchAngle ?? 45;
        const g = appState.params.gravity ?? 9.8;
        const rad = (deg * Math.PI) / 180;
        const vx = v0 * Math.cos(rad);
        const vy = v0 * Math.sin(rad) - g * t;
        const xPos = vx * t;
        const yPos = Math.max(0, v0 * Math.sin(rad) * t - 0.5 * g * t * t);

        if (ent.ball) {
          ent.ball.position.set(-10 + xPos * 0.8, 0.6 + yPos * 0.8, 0);
        }
        yMetric1 = yPos;
        yMetric2 = xPos;
        if (metricsEl) {
          metricsEl.innerHTML = `
            <div>Posisi: x = <strong>${xPos.toFixed(2)} m</strong> | y = <strong>${yPos.toFixed(2)} m</strong></div>
            <div>Kecepatan: vx = ${vx.toFixed(2)} m/s | vy = ${vy.toFixed(2)} m/s</div>
          `;
        }
      } else if (modId === 'hukum-newton') {
        const m = appState.params.massBlock ?? 5;
        const fPush = appState.params.pushForce ?? 35;
        const mu = appState.params.frictionCoeff ?? 0.25;
        const g = 9.8;
        const fMax = mu * 1.2 * m * g; // gesek statis maksimum (μs = 1,2·μk)
        const moving = fPush > fMax;
        const fk = moving ? mu * m * g : Math.min(fPush, fMax);
        const netF = moving ? fPush - fk : 0;
        const acc = netF / m;
        const disp = 0.5 * acc * t * t;

        if (ent.block && ent.pushArrow && ent.fricArrow) {
          const bx = -6 + Math.min(18, disp * 0.5);
          ent.block.position.x = bx;
          ent.pushArrow.position.set(bx + 1.2, 1.5, 0);
          ent.pushArrow.setLength(Math.max(0.5, fPush * 0.05), 0.7, 0.45);
          ent.fricArrow.position.set(bx - 1.2, 0.8, 0);
          ent.fricArrow.setLength(Math.max(0.4, fk * 0.05), 0.6, 0.4);
        }
        yMetric1 = acc;
        yMetric2 = netF;
        if (metricsEl) {
          metricsEl.innerHTML = `
            <div>Percepatan a: <strong>${acc.toFixed(2)} m/s²</strong> (ΣF = ${netF.toFixed(1)} N)</div>
            <div>Gaya Gesek ${moving ? 'kinetik' : 'statis'}: <strong>${fk.toFixed(2)} N</strong> | Posisi: ${disp.toFixed(2)} m</div>
          `;
        }
      } else if (modId === 'usaha-energi') {
        const m = appState.params.coasterMass ?? 4;
        const hStart = appState.params.startHeight ?? 16;
        const g = 9.8;
        const u = (t * 0.35) % 1;
        if (ent.cart && ent.curve) {
          const pt = ent.curve.getPointAt(u);
          ent.cart.position.copy(pt);
          const hNow = Math.max(0.2, (pt.y / (0.65 * (ent.hBuilt || hStart))) * hStart);
          const ep = m * g * hNow;
          const em = m * g * hStart;
          const ek = Math.max(0, em - ep);
          yMetric1 = ep;
          yMetric2 = ek;
          if (metricsEl) {
            metricsEl.innerHTML = `
              <div>Ep: <strong class="text-sky-300">${ep.toFixed(1)} J</strong> | Ek: <strong class="text-amber-300">${ek.toFixed(1)} J</strong></div>
              <div>Energi Mekanik Total Em: <strong>${em.toFixed(1)} J</strong> (h ≈ ${hNow.toFixed(1)} m)</div>
            `;
          }
        }
      } else if (modId === 'momentum-impuls') {
        const m1 = appState.params.m1 ?? 4;
        const v1 = appState.params.v1 ?? 6;
        const m2 = appState.params.m2 ?? 4;
        const v2 = appState.params.v2 ?? -3;
        const e = appState.params.restitution ?? 1;

        const tHit = v1 > v2 ? (10 - 1.9) / ((v1 - v2) * 0.45) : Infinity;
        const v1After = ((m1 - e * m2) * v1 + (1 + e) * m2 * v2) / (m1 + m2);
        const v2After = ((m2 - e * m1) * v2 + (1 + e) * m1 * v1) / (m1 + m2);

        let x1, x2, curV1, curV2;
        if (t < tHit) {
          x1 = -5 + v1 * t * 0.45;
          x2 = 5 + v2 * t * 0.45;
          curV1 = v1;
          curV2 = v2;
        } else {
          const xHit1 = -5 + v1 * tHit * 0.45;
          const xHit2 = 5 + v2 * tHit * 0.45;
          const dtAfter = t - tHit;
          x1 = xHit1 + v1After * dtAfter * 0.45;
          x2 = xHit2 + v2After * dtAfter * 0.45;
          curV1 = v1After;
          curV2 = v2After;
        }

        if (ent.ball1 && ent.ball2) {
          ent.ball1.position.x = Math.max(-14, Math.min(14, x1));
          ent.ball2.position.x = Math.max(-14, Math.min(14, x2));
        }

        const pTotal = m1 * curV1 + m2 * curV2;
        yMetric1 = m1 * curV1;
        yMetric2 = m2 * curV2;
        if (metricsEl) {
          metricsEl.innerHTML = `
            <div>p1 = ${(m1 * curV1).toFixed(1)} kg·m/s | p2 = ${(m2 * curV2).toFixed(1)} kg·m/s</div>
            <div>Momentum Total: <strong>${pTotal.toFixed(1)} kg·m/s</strong> (v1=${curV1.toFixed(1)}, v2=${curV2.toFixed(1)} m/s)</div>
          `;
        }
      } else if (modId === 'getaran-gelombang') {
        const amp = appState.params.amplitude ?? 1.2;
        const freq = appState.params.frequency ?? 1.1;
        const lamb = appState.params.wavelength ?? 3.0;
        const omega = 2 * Math.PI * freq;
        const k = (2 * Math.PI) / lamb;
        const vel = lamb * freq;

        const bobX = -6 + amp * 1.4 * Math.cos(omega * t);
        if (ent.massBob) {
          ent.massBob.position.x = bobX;
        }
        if (ent.springLine) {
          const sPts = [];
          const coils = 16;
          for (let i = 0; i <= coils; i++) {
            const frac = i / coils;
            const sx = -10 + frac * (bobX - 0.75 - (-10));
            const sy = 2.5 + (i === 0 || i === coils ? 0 : Math.sin(frac * Math.PI * 10) * 0.35);
            sPts.push(new THREE.Vector3(sx, sy, 0));
          }
          ent.springLine.geometry.dispose();
          ent.springLine.geometry = new THREE.BufferGeometry().setFromPoints(sPts);
        }

        if (ent.waveDots) {
          ent.waveDots.forEach((dot, idx) => {
            const xWorld = dot.position.x;
            const yWave = 2.5 + amp * 0.85 * Math.sin(k * xWorld - omega * t);
            dot.position.y = yWave;
          });
        }

        const curDisp = amp * Math.sin(omega * t);
        yMetric1 = curDisp;
        yMetric2 = vel;
        if (metricsEl) {
          metricsEl.innerHTML = `
            <div>Cepat Rambat v = λ·f: <strong>${vel.toFixed(2)} m/s</strong> (T = ${(1/freq).toFixed(2)} s)</div>
            <div>Simpangan y(t): <strong>${curDisp.toFixed(2)} m</strong> | A = ${amp} m, f = ${freq} Hz</div>
          `;
        }
      }

      if (appState.isPlaying) {
        appState.telemetryHistory.push({ t, m1: yMetric1, m2: yMetric2 });
        if (appState.telemetryHistory.length > 90) {
          appState.telemetryHistory.shift();
        }
      }
    }

    function renderTelemetryGraph() {
      const canvas = document.getElementById('telemetry-graph');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.clientWidth || 300;
      const h = canvas.clientHeight || 120;
      if (canvas.width !== w) canvas.width = w;
      if (canvas.height !== h) canvas.height = h;

      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#040814';
      ctx.fillRect(0, 0, w, h);

      // Center axis
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.16)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, h / 2);
      ctx.lineTo(w, h / 2);
      ctx.stroke();

      const data = appState.telemetryHistory;
      if (data.length < 2) return;

      const maxAbs = Math.max(
        1,
        ...data.map((d) => Math.max(Math.abs(d.m1), Math.abs(d.m2)))
      );

      const drawSeries = (key, color) => {
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        data.forEach((pt, i) => {
          const px = (i / (data.length - 1)) * (w - 16) + 8;
          const py = h / 2 - (pt[key] / maxAbs) * (h * 0.38);
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        });
        ctx.stroke();
      };

      drawSeries('m1', '#38bdf8');
      drawSeries('m2', '#fbbf24');

      const LBL = {
        'pengukuran': ['Jangka sorong (mm)', 'Mikrometer (mm)'],
        'vektor': ['R (N)', 'Rx (N)'],
        'gerak-lurus': ['Δx (m)', 'v (m/s)'],
        'parabola': ['y (m)', 'x (m)'],
        'hukum-newton': ['a (m/s²)', 'ΣF (N)'],
        'usaha-energi': ['Ep (J)', 'Ek (J)'],
        'momentum-impuls': ['p₁ (kg·m/s)', 'p₂ (kg·m/s)'],
        'getaran-gelombang': ['y (m)', 'v (m/s)']
      }[appState.activeModuleId] || ['m1', 'm2'];
      ctx.font = '10px JetBrains Mono, monospace';
      ctx.fillStyle = '#38bdf8'; ctx.fillText('— ' + LBL[0], 8, 12);
      ctx.fillStyle = '#fbbf24'; ctx.fillText('— ' + LBL[1], 8, 24);
      ctx.fillStyle = 'rgba(148,163,184,0.8)';
      ctx.fillText('±' + maxAbs.toFixed(1), w - 52, 12);
      ctx.fillText('t → ' + data[data.length - 1].t.toFixed(1) + ' s', w - 76, h - 6);
    }

    /* =========================================================================
       10. HALAMAN KUIS INTERAKTIF
       ========================================================================= */
    function renderQuizView() {
      if (appState.quizFinished) {
        const correctCount = appState.quizAnswers.filter((a) => a.isCorrect).length;
        const score = Math.round((correctCount / QUIZ_BANK.length) * 100);

        return `
          <section class="max-w-3xl mx-auto px-4 sm:px-6 py-10 space-y-6">
            <div class="rounded-2xl bg-navy-900 border border-electric-500/30 p-6 sm:p-8 text-center space-y-4 electric-glow">
              <div class="text-xs font-mono uppercase tracking-widest text-electric-400">Hasil Evaluasi Kuis</div>
              <div class="text-5xl font-extrabold font-mono text-white">${score}</div>
              <p class="text-sm sm:text-base text-slate-300">
                Kamu menjawab benar <strong class="text-emerald-400">${correctCount}</strong> dari <strong class="text-white">${QUIZ_BANK.length}</strong> soal Fisika Kelas X.
              </p>
              <div class="pt-2 flex flex-wrap justify-center gap-3">
                <button onclick="restartQuiz()" class="px-5 py-2.5 rounded-xl bg-electric-500 hover:bg-electric-400 text-navy-950 font-bold text-sm transition">
                  Ulangi Kuis
                </button>
                <button onclick="navigateTo('progress')" class="px-5 py-2.5 rounded-xl bg-navy-800 hover:bg-navy-700 text-slate-100 font-semibold text-sm border border-slate-700 transition">
                  Lihat Progres Belajar
                </button>
              </div>
            </div>

            <div class="space-y-3">
              <h2 class="text-lg font-bold text-white">Pembahasan Jawaban</h2>
              ${QUIZ_BANK.map((item, idx) => {
                const ans = appState.quizAnswers[idx];
                return `
                  <div class="rounded-xl bg-navy-900/90 border ${ans && ans.isCorrect ? 'border-emerald-500/40' : 'border-rose-500/40'} p-4 space-y-1.5">
                    <div class="text-xs font-mono text-slate-400">Soal ${idx + 1} • ${ans && ans.isCorrect ? '<span class="text-emerald-400">Benar</span>' : '<span class="text-rose-400">Perlu Diulas</span>'}</div>
                    <p class="text-sm font-semibold text-white">${item.q}</p>
                    <p class="text-xs text-sky-300 font-mono">Jawaban benar: ${item.options[item.correct]}</p>
                    <p class="text-xs text-slate-300 leading-relaxed">${item.explain}</p>
                  </div>
                `;
              }).join('')}
            </div>
          </section>
        `;
      }

      const item = QUIZ_BANK[appState.quizIndex];
      const hasAnswered = appState.quizSelected !== null;

      return `
        <section class="max-w-3xl mx-auto px-4 sm:px-6 py-10">
          <div class="rounded-2xl bg-navy-900/95 border border-slate-800 p-5 sm:p-7 space-y-6">
            <div class="flex items-center justify-between text-xs font-mono text-slate-400">
              <span>SOAL ${appState.quizIndex + 1} / ${QUIZ_BANK.length}</span>
              <span class="text-electric-400 uppercase">${item.moduleId}</span>
            </div>

            <h1 class="text-lg sm:text-xl font-bold text-white leading-snug">${item.q}</h1>

            <div class="space-y-2.5">
              ${item.options.map((opt, idx) => {
                let cls = 'bg-navy-950 hover:bg-navy-800 border-slate-800 text-slate-200';
                if (hasAnswered) {
                  if (idx === item.correct) {
                    cls = 'bg-emerald-500/20 border-emerald-400 text-emerald-200 font-semibold';
                  } else if (idx === appState.quizSelected) {
                    cls = 'bg-rose-500/20 border-rose-400 text-rose-200';
                  }
                }
                return `
                  <button onclick="selectQuizOption(${idx})" ${hasAnswered ? 'disabled' : ''} class="w-full text-left px-4 py-3 rounded-xl border text-sm transition flex items-center justify-between ${cls}">
                    <span>${opt}</span>
                    <span class="font-mono text-xs">${['A', 'B', 'C', 'D'][idx]}</span>
                  </button>
                `;
              }).join('')}
            </div>

            ${hasAnswered ? `
              <div class="p-4 rounded-xl bg-navy-950 border border-electric-500/30 text-xs sm:text-sm text-slate-200 space-y-2">
                <div class="font-bold text-electric-400">Pembahasan:</div>
                <p>${item.explain}</p>
              </div>
              <div class="flex justify-end">
                <button onclick="nextQuizQuestion()" class="px-5 py-2.5 rounded-xl bg-electric-500 hover:bg-electric-400 text-navy-950 font-bold text-sm transition">
                  ${appState.quizIndex + 1 < QUIZ_BANK.length ? 'Soal Berikutnya →' : 'Selesaikan Kuis'}
                </button>
              </div>
            ` : ''}
          </div>
        </section>
      `;
    }

    function selectQuizOption(idx) {
      if (appState.quizSelected !== null) return;
      appState.quizSelected = idx;
      const item = QUIZ_BANK[appState.quizIndex];
      appState.quizAnswers[appState.quizIndex] = {
        selected: idx,
        isCorrect: idx === item.correct
      };
      navigateTo('quiz');
    }

    function nextQuizQuestion() {
      appState.quizSelected = null;
      window.scrollTo(0, 0);
      if (appState.quizIndex + 1 < QUIZ_BANK.length) {
        appState.quizIndex += 1;
      } else {
        appState.quizFinished = true;
        const cc = appState.quizAnswers.filter((a) => a && a.isCorrect).length;
        appState.progress.quizScores['utama'] = { score: Math.round((cc / QUIZ_BANK.length) * 100), correctCount: cc, total: QUIZ_BANK.length };
        saveProgress();
      }
      navigateTo('quiz');
    }

    function restartQuiz() {
      QUIZ_BANK.sort(() => Math.random() - 0.5);
      appState.quizIndex = 0;
      appState.quizSelected = null;
      appState.quizAnswers = [];
      appState.quizFinished = false;
      navigateTo('quiz');
    }

    /* =========================================================================
       11. HALAMAN LEARNING PROGRESS (LOCAL STORAGE)
       ========================================================================= */
    function renderProgressView() {
      const doneCount = appState.progress.completedModules.length;
      const pct = Math.round((doneCount / MODULES.length) * 100);
      const quizInfo = appState.progress.quizScores['utama'];

      return `
        <section class="max-w-5xl mx-auto px-4 sm:px-6 py-10 space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <span class="text-xs font-mono text-electric-400 uppercase tracking-wider">Penyimpanan Lokal Perangkat</span>
              <h1 class="text-2xl sm:text-3xl font-extrabold text-white mt-1">Progres Belajar Kamu</h1>
            </div>
            <button onclick="resetAllProgress()" class="px-4 py-2 rounded-xl bg-navy-900 hover:bg-rose-950/60 text-rose-300 border border-rose-500/30 text-xs font-semibold transition self-start sm:self-auto">
              Reset Progres
            </button>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="rounded-2xl bg-navy-900 border border-slate-800 p-5">
              <div class="text-xs text-slate-400">Penyelesaian Modul</div>
              <div class="text-3xl font-extrabold font-mono text-electric-400 mt-1">${pct}%</div>
              <div class="text-xs text-slate-400 mt-1">${doneCount} dari ${MODULES.length} materi selesai</div>
            </div>
            <div class="rounded-2xl bg-navy-900 border border-slate-800 p-5">
              <div class="text-xs text-slate-400">Nilai Kuis Terakhir</div>
              <div class="text-3xl font-extrabold font-mono text-emerald-400 mt-1">${quizInfo ? quizInfo.score : '-'}</div>
              <div class="text-xs text-slate-400 mt-1">${quizInfo ? `${quizInfo.correctCount}/${quizInfo.total} jawaban benar` : 'Belum mengerjakan kuis'}</div>
            </div>
            <div class="rounded-2xl bg-navy-900 border border-slate-800 p-5">
              <div class="text-xs text-slate-400">Tantangan Target Selesai</div>
              <div class="text-3xl font-extrabold font-mono text-amber-400 mt-1">${appState.progress.challengesSolved.length}</div>
              <div class="text-xs text-slate-400 mt-1">Waktu simulasi: ${Math.round(appState.progress.totalSimTimeSec)} dtk</div>
            </div>
          </div>

          <div class="rounded-2xl bg-navy-900 border border-slate-800 p-5 space-y-3">
            <h2 class="text-base font-bold text-white">Status Tiap Modul</h2>
            <div class="divide-y divide-slate-800">
              ${MODULES.map((m) => {
                const done = appState.progress.completedModules.includes(m.id);
                return `
                  <div class="py-3 flex items-center justify-between gap-3">
                    <div>
                      <div class="text-sm font-semibold text-white">${m.icon} ${m.title}</div>
                      <div class="text-xs text-slate-400">${m.code}</div>
                    </div>
                    <div class="flex items-center gap-2">
                      <span class="text-xs font-mono px-2.5 py-1 rounded-full ${
                        done ? 'bg-emerald-500/15 text-emerald-400' : 'bg-navy-950 text-slate-400'
                      }">${done ? 'Selesai' : 'Belum'}</span>
                      <button onclick="navigateTo('simulation', '${m.id}')" class="text-xs font-semibold text-electric-400 hover:underline">Buka</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </section>
      `;
    }

    function resetAllProgress() {
      appState.progress = {
        completedModules: [],
        quizScores: {},
        challengesSolved: [],
        totalSimTimeSec: 0
      };
      saveProgress();
      showToast('Seluruh progres belajar telah direset.');
      navigateTo('progress');
    }

    /* =========================================================================
       12. MODAL KALKULATOR RUMUS & ILMIAH + KONVERSI SATUAN
       ========================================================================= */
    function openToolModal(tab = 'calc') {
      document.getElementById('tool-modal').classList.remove('hidden');
      switchToolTab(tab);
    }

    function closeToolModal() {
      document.getElementById('tool-modal').classList.add('hidden');
    }

    function switchToolTab(tab) {
      const calcBtn = document.getElementById('tab-tool-calc');
      const convBtn = document.getElementById('tab-tool-conv');
      const body = document.getElementById('tool-modal-body');

      if (tab === 'calc') {
        calcBtn.className = 'px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold bg-electric-500 text-navy-950 transition';
        convBtn.className = 'px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold bg-navy-900 text-slate-300 hover:text-white border border-slate-700 transition';
        body.innerHTML = renderFormulaAndScientificCalc();
        bindFormulaCalcEvents();
      } else {
        convBtn.className = 'px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold bg-electric-500 text-navy-950 transition';
        calcBtn.className = 'px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold bg-navy-900 text-slate-300 hover:text-white border border-slate-700 transition';
        body.innerHTML = renderUnitConverterUI();
        recalcUnitConverter();
      }
    }

    function renderFormulaAndScientificCalc() {
      return `
        <div class="space-y-4">
          <div class="space-y-1.5">
            <label class="text-xs font-bold uppercase tracking-wider text-electric-400">Kalkulator Rumus Fisika Kelas X</label>
            <select id="formula-select" class="w-full px-3 py-2.5 rounded-xl bg-navy-950 border border-slate-700 text-sm text-white focus:border-electric-400 outline-none">
              ${MODULES.map((m, idx) => `<option value="${idx}">${m.title} — ${m.calcPreset.name}</option>`).join('')}
            </select>
          </div>

          <div id="formula-inputs" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>

          <div id="formula-output" class="p-4 rounded-xl bg-navy-950 border border-electric-500/30 space-y-1">
            <!-- Hasil rumus -->
          </div>
        </div>

        <div class="pt-4 border-t border-slate-800 space-y-3">
          <label class="text-xs font-bold uppercase tracking-wider text-electric-400">Kalkulator Ilmiah Cepat</label>
          <div class="flex gap-2">
            <input id="sci-expr" type="text" value="sqrt(144) + sin(30 * pi / 180) * 10" class="flex-1 px-3 py-2 rounded-xl bg-navy-950 border border-slate-700 font-mono text-sm text-white outline-none focus:border-electric-400" placeholder="Contoh: 2 * 9.8 * 5 atau pow(3, 2)" />
            <button onclick="evalScientificExpr()" class="px-4 py-2 rounded-xl bg-electric-500 hover:bg-electric-400 text-navy-950 font-bold text-sm transition">
              Hitung
            </button>
          </div>
          <div id="sci-result" class="font-mono text-sm text-emerald-400 bg-navy-950 px-3.5 py-2.5 rounded-xl border border-slate-800">
            Hasil: siap dihitung
          </div>
        </div>
      `;
    }

    function bindFormulaCalcEvents() {
      const sel = document.getElementById('formula-select');
      if (!sel) return;

      const renderVars = () => {
        const mod = MODULES[parseInt(sel.value, 10)] || MODULES[0];
        const preset = mod.calcPreset;
        const container = document.getElementById('formula-inputs');
        container.innerHTML = preset.vars.map((v) => `
          <div>
            <label class="block text-xs text-slate-300 mb-1">${v.label}</label>
            <input data-var="${v.id}" type="number" step="any" value="${v.val}" class="formula-var-input w-full px-3 py-2 rounded-xl bg-navy-950 border border-slate-700 font-mono text-sm text-white outline-none focus:border-electric-400" />
          </div>
        `).join('');

        const computeNow = () => {
          const vals = {};
          container.querySelectorAll('.formula-var-input').forEach((inp) => {
            vals[inp.dataset.var] = parseFloat(inp.value) || 0;
          });
          const out = preset.compute(vals);
          document.getElementById('formula-output').innerHTML = `
            <div class="text-base font-extrabold font-mono text-emerald-400">${out.result}</div>
            <div class="text-xs font-mono text-slate-300">${out.explanation}</div>
          `;
        };

        container.querySelectorAll('.formula-var-input').forEach((inp) => {
          inp.addEventListener('input', computeNow);
        });
        computeNow();
      };

      sel.addEventListener('change', renderVars);
      renderVars();
      evalScientificExpr();
    }

    function evalScientificExpr() {
      const inp = document.getElementById('sci-expr');
      const out = document.getElementById('sci-result');
      if (!inp || !out) return;
      try {
        const expr = inp.value
          .replace(/\bpi\b/gi, 'Math.PI')
          .replace(/\bsqrt\b/gi, 'Math.sqrt')
          .replace(/\bsin\b/gi, 'Math.sin')
          .replace(/\bcos\b/gi, 'Math.cos')
          .replace(/\btan\b/gi, 'Math.tan')
          .replace(/\babs\b/gi, 'Math.abs')
          .replace(/\bpow\b/gi, 'Math.pow')
          .replace(/\bln\b/gi, 'Math.log')
          .replace(/\blog\b/gi, 'Math.log10')
          .replace(/\^/g, '**');
        if (/[a-df-zA-DF-Z_$]/.test(expr.replace(/Math\.[A-Za-z0-9]+/g, ''))) throw new Error('bad');
        const val = Function(`"use strict"; return (${expr});`)();
        out.textContent = `Hasil: ${Number.isFinite(val) ? Number(val.toFixed(6)) : 'Tidak terdefinisi'}`;
      } catch (e) {
        out.textContent = 'Ekspresi tidak valid. Gunakan angka & fungsi seperti sqrt(), sin(), cos().';
      }
    }

    const UNIT_CATEGORIES = {
      panjang: {
        label: 'Panjang',
        units: { m: 1, km: 1000, cm: 0.01, mm: 0.001 }
      },
      massa: {
        label: 'Massa',
        units: { kg: 1, g: 0.001, mg: 0.000001, ton: 1000 }
      },
      waktu: {
        label: 'Waktu',
        units: { s: 1, menit: 60, jam: 3600, ms: 0.001 }
      },
      kecepatan: {
        label: 'Kecepatan',
        units: { 'm/s': 1, 'km/jam': 1000 / 3600 }
      },
      gaya: {
        label: 'Gaya',
        units: { N: 1, kN: 1000, dyne: 0.00001 }
      },
      energi: {
        label: 'Energi',
        units: { J: 1, kJ: 1000, kal: 4.184, kkal: 4184 }
      }
    };

    function renderUnitConverterUI() {
      return `
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-electric-400 mb-1.5">Kategori Besaran</label>
            <select id="conv-cat" onchange="populateConvUnits(); recalcUnitConverter();" class="w-full px-3 py-2.5 rounded-xl bg-navy-950 border border-slate-700 text-sm text-white outline-none">
              ${Object.entries(UNIT_CATEGORIES).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('')}
            </select>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 items-end">
            <div>
              <label class="block text-xs text-slate-300 mb-1">Nilai</label>
              <input id="conv-val" type="number" step="any" value="100" oninput="recalcUnitConverter()" class="w-full px-3 py-2 rounded-xl bg-navy-950 border border-slate-700 font-mono text-sm text-white outline-none" />
            </div>
            <div>
              <label class="block text-xs text-slate-300 mb-1">Dari Satuan</label>
              <select id="conv-from" onchange="recalcUnitConverter()" class="w-full px-3 py-2 rounded-xl bg-navy-950 border border-slate-700 font-mono text-sm text-white outline-none"></select>
            </div>
            <div>
              <label class="block text-xs text-slate-300 mb-1">Ke Satuan</label>
              <select id="conv-to" onchange="recalcUnitConverter()" class="w-full px-3 py-2 rounded-xl bg-navy-950 border border-slate-700 font-mono text-sm text-white outline-none"></select>
            </div>
          </div>

          <div id="conv-output" class="p-4 rounded-xl bg-navy-950 border border-electric-500/30 font-mono text-base font-bold text-electric-300">
            <!-- Hasil konversi -->
          </div>
        </div>
      `;
    }

    function populateConvUnits() {
      const catKey = document.getElementById('conv-cat')?.value || 'panjang';
      const keys = Object.keys(UNIT_CATEGORIES[catKey].units);
      const fromSel = document.getElementById('conv-from');
      const toSel = document.getElementById('conv-to');
      if (!fromSel || !toSel) return;

      fromSel.innerHTML = keys.map((u) => `<option value="${u}">${u}</option>`).join('');
      toSel.innerHTML = keys.map((u, idx) => `<option value="${u}" ${idx === 1 ? 'selected' : ''}>${u}</option>`).join('');
    }

    function recalcUnitConverter() {
      const fromSel = document.getElementById('conv-from');
      if (fromSel && fromSel.options.length === 0) {
        populateConvUnits();
      }
      const catKey = document.getElementById('conv-cat')?.value || 'panjang';
      const val = parseFloat(document.getElementById('conv-val')?.value || '0') || 0;
      const fromU = document.getElementById('conv-from')?.value;
      const toU = document.getElementById('conv-to')?.value;
      const outEl = document.getElementById('conv-output');
      if (!fromU || !toU || !outEl) return;

      const factors = UNIT_CATEGORIES[catKey].units;
      const baseVal = val * factors[fromU];
      const converted = baseVal / factors[toU];
      outEl.textContent = `${val} ${fromU} = ${Number(converted.toPrecision(6))} ${toU}`;
    }

    /* =========================================================================
       13. INISIALISASI PERTAMA KALI
       ========================================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      navigateTo('home');
    });
  </script>
